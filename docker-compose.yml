services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - touji_caddy_data:/data
      - touji_caddy_config:/config
    networks:
      - touji_internal

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - touji_pg_data:/var/lib/postgresql/data
    networks:
      - touji_internal

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      ACCOUNT_ORIGIN: ${ACCOUNT_ORIGIN:-https://orbitshz.com}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-session}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - touji_internal

volumes:
  touji_pg_data:
  touji_caddy_data:
  touji_caddy_config:

networks:
  touji_internal:
    driver: bridge
